name: CI

on:
  push:
    branches: [main]
  pull_request: # never pull_request_target: fork PRs get a read-only token and no secrets
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies (hash-checked)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: pytest (offline)
        run: python -m pytest -q
      - name: pip-audit (fails on known vulnerabilities)
        run: python -m pip_audit --strict --disable-pip --require-hashes -r requirements.txt -r requirements-dev.txt

  lint:
    name: Lint and static security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies (hash-checked)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: bandit
        run: bandit -r quakewatch

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # Release binary pinned by version and SHA-256 (from the release's checksums file),
      # instead of gitleaks-action, so the job needs no token or license secret.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL --proto '=https' -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
